name: Update GitHub Streak SVG

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate streak & repo cards SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          node scripts/generate-streak.mjs "$GITHUB_USERNAME" ubuntu assets/streak.svg
          node scripts/generate-repo-cards.mjs "$GITHUB_USERNAME"

      - name: Commit updated telemetry SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No changes to telemetry SVGs"
          else
            git commit -m "chore: update streak & repo telemetry SVGs"
            git push
          fi
